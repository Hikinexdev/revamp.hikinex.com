name: Deploy HIKINEX concepts to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            portal-concepts/package.json
            navigator/package.json
            commons/package.json
      - name: Install and build Portal Concepts
        working-directory: portal-concepts
        run: npm install && npm run build
      - name: Install and build Navigator
        working-directory: navigator
        run: npm install && npm run build
      - name: Install and build Commons
        working-directory: commons
        run: npm install && npm run build
      - name: Create static GitHub Pages bundle
        run: node scripts/export-github-pages.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
